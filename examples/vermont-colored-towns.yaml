# Vermont Colored Towns
# Colors towns by county - towns in the same county share a base color
#
# Run with: chimborazo build -v examples/vermont-colored-towns.yaml

name: Vermont Colored Towns

output:
  path: output/vermont-towns.svg
  width: 12
  height: 18
  units: inches
  quality: high

bounds:
  source: census://state/VT
  padding: 0.05

layers:
  # State boundary (rendered on top)
  - name: state_boundary
    source: census://state/VT
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "2.0"
      fill: "none"
      order: "100"

  # County boundaries (medium weight)
  - name: counties
    source: census://county/VT
    operations:
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "1.5"
      fill: "none"
      order: "80"

  # Towns colored by county
  - name: towns
    source: census://cousub/VT
    operations:
      - type: clip
    fill_by: COUNTYFP
    color_map:
      # Vermont county FIPS codes
      "001": "#E8F5E9"   # Addison - light green
      "003": "#FFF3E0"   # Bennington - light orange
      "005": "#E3F2FD"   # Caledonia - light blue
      "007": "#FCE4EC"   # Chittenden - light pink
      "009": "#F3E5F5"   # Essex - light purple
      "011": "#E0F7FA"   # Franklin - light cyan
      "013": "#FFF8E1"   # Grand Isle - light amber
      "015": "#E8EAF6"   # Lamoille - light indigo
      "017": "#FFEBEE"   # Orange - light red
      "019": "#E1F5FE"   # Orleans - light blue
      "021": "#F1F8E9"   # Rutland - light lime
      "023": "#FBE9E7"   # Washington - light deep orange
      "025": "#E0F2F1"   # Windham - light teal
      "027": "#EDE7F6"   # Windsor - light deep purple
    vary_fill: true
    style:
      stroke: "#999999"
      stroke_width: "0.3"
      fill: "#EEEEEE"
      order: "50"
