# Vermont Plotter-Ready Map
# Outputs each layer as a separate SVG for multi-pen plotting
#
# Run with: chimborazo build examples/vermont-plotter.yaml
#
# Outputs:
#   output/vermont-plotter.svg (combined)
#   output/vermont-plotter_state_boundary.svg
#   output/vermont-plotter_counties.svg

name: Vermont Plotter Map

output:
  path: output/vermont-plotter.svg
  width: 12
  height: 18
  units: inches
  per_layer: true
  margin: 0.5

bounds:
  source: census://state/VT
  padding: 0.05

layers:
  # State boundary - black pen, thick
  - name: state_boundary
    source: census://state/VT
    operations:
      - type: clip
    style:
      stroke: "#000000"
      stroke_width: "2.0"
      fill: "none"
      order: "100"

  # County boundaries - blue pen, medium
  - name: counties
    source: census://county/VT
    operations:
      - type: clip
      - type: simplify
        params:
          tolerance: 0.0001
    style:
      stroke: "#0066CC"
      stroke_width: "1.0"
      fill: "none"
      order: "50"
