# Vermont State Map with Grand Isle County Water Cut Out
# Simpler test of subtract with fewer features (Grand Isle county FIPS 50001)
#
# Run with: chimborazo build examples/vermont-water-simple.yaml

name: Vermont with Grand Isle Water Subtracted

output:
  path: output/vermont-water-simple.svg
  width: 12
  height: 18
  units: inches

bounds:
  source: census://state/VT
  padding: 0.05

layers:
  # State boundary with one county's water cut out
  - name: state_land
    source: census://state/VT
    operations:
      - type: subtract
        params:
          # Just Grand Isle county water (smallest county, borders Lake Champlain)
          source: file://~/Library/Caches/strata/census/tiger/2023/vt/areawater/county_000/tl_2023_50001_areawater.shp
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "2.0"
      fill: "#f5f5f5"
      order: "100"

  # County boundaries
  - name: counties
    source: census://county/VT
    operations:
      - type: clip
      - type: simplify
        params:
          tolerance: 0.0001
    style:
      stroke: "#999999"
      stroke_width: "0.5"
      fill: "none"
      order: "50"
