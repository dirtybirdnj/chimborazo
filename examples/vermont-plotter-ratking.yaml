# Vermont Plotter Map - Rat King Edition
# Version with 5-star rated patterns from rat-king for pen plotter
# Each region has 6 patterns (one per shade 0-5), embedded as data-pattern attributes
#
# 5-star patterns: lines, crosshatch, zigzag, wiggle, spiral, concentric,
#                  honeycomb, brick, truchet, stripe, gosper, hilbert, peano, meander
#
# Run with: chimborazo build examples/vermont-plotter-ratking.yaml
# Then:     rat-king fill output/vermont-plotter-ratking.svg -o output/vermont-plotter-ratking-filled.svg

name: Vermont Plotter Ratking

output:
  path: output/vermont-plotter-ratking.svg
  width: 12
  height: 18
  units: inches
  quality: plotter
  min_feature_size: 0
  rulers: true

bounds:
  # Centered on Vermont
  # [West, South, East, North]
  explicit: [-73.65, 42.45, -71.45, 45.45]
  padding: 0.02

layers:
  # Towns/cousubs for each state - emit water layers via subtract operation
  # This ensures water display matches cutouts exactly (no offset issues)

  - name: towns_vt
    source: census://cousub/VT
    patterns:
      - concentric   # shade 0
      - zigzag       # shade 1
      - honeycomb    # shade 2
      - meander      # shade 3
      - spiral       # shade 4
      - truchet      # shade 5
    operations:
      - type: subtract
        params:
          source: census://areawater/VT
          by_county: true
          min_size: 3
          emit_as: water_vt
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  - name: towns_ny
    source: census://cousub/NY
    patterns:
      - lines        # shade 0
      - brick        # shade 1
      - wiggle       # shade 2
      - hilbert      # shade 3
      - crosshatch   # shade 4
      - gosper       # shade 5
    operations:
      - type: subtract
        params:
          source: census://areawater/NY
          by_county: true
          min_size: 3
          emit_as: water_ny
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  - name: towns_nh
    source: census://cousub/NH
    patterns:
      - peano        # shade 0
      - concentric   # shade 1
      - stripe       # shade 2
      - zigzag       # shade 3
      - honeycomb    # shade 4
      - spiral       # shade 5
    operations:
      - type: subtract
        params:
          source: census://areawater/NH
          by_county: true
          min_size: 3
          emit_as: water_nh
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  - name: towns_ma
    source: census://cousub/MA
    patterns:
      - meander      # shade 0
      - truchet      # shade 1
      - hilbert      # shade 2
      - lines        # shade 3
      - wiggle       # shade 4
      - brick        # shade 5
    operations:
      - type: subtract
        params:
          source: census://areawater/MA
          by_county: true
          min_size: 3
          emit_as: water_ma
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  # County boundaries for each state (no patterns - just outlines)
  - name: counties_vt
    source: census://county/VT
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  - name: counties_ny
    source: census://county/NY
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  - name: counties_nh
    source: census://county/NH
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  - name: counties_ma
    source: census://county/MA
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  # Quebec municipalities (Canadian data)
  - name: quebec_muni
    source: quebec://municipalities
    patterns:
      - gosper       # shade 0
      - stripe       # shade 1
      - peano        # shade 2
      - crosshatch   # shade 3
      - concentric   # shade 4
      - zigzag       # shade 5
    operations:
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  # NHN water for Lake Champlain Quebec portion (all use concentric)
  - name: water_quebec_champlain
    source: canada://nhn/02OHB00
    patterns:
      - concentric
    operations:
      - type: filter_by_size
        params:
          min_size: 3
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "15"

  # NHN water for Richelieu River corridor
  - name: water_richelieu
    source: canada://nhn/02OJ000
    patterns:
      - concentric
    operations:
      - type: filter_by_size
        params:
          min_size: 3
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "15"

  # NHN water for Lake Memphremagog area
  - name: water_memphremagog
    source: canada://nhn/02OE000
    patterns:
      - concentric
    operations:
      - type: filter_by_size
        params:
          min_size: 3
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "15"

  # State/Province boundaries (no patterns - just outlines)
  - name: state_vt
    source: census://state/VT
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"

  - name: state_ny
    source: census://state/NY
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"

  - name: state_nh
    source: census://state/NH
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"

  - name: state_ma
    source: census://state/MA
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"
