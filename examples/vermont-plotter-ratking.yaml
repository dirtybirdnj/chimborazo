# Vermont Plotter Map - Rat King Edition
# Version with 5-star rated patterns from rat-king for pen plotter
# Each region has 6 patterns with spacing/angle variations
#
# 5-star patterns: lines, crosshatch, zigzag, wiggle, spiral, concentric,
#                  honeycomb, brick, truchet, stripe, gosper, hilbert, peano, meander
#
# Run with: chimborazo build examples/vermont-plotter-ratking.yaml
# Then:     rat-king fill output/vermont-plotter-ratking.svg -o output/vermont-plotter-ratking-filled.svg

name: Vermont Plotter Ratking

output:
  path: output/vermont-plotter-ratking.svg
  width: 12
  height: 18
  units: inches
  quality: plotter
  min_feature_size: 0
  rulers: true

bounds:
  # Centered on Vermont
  # [West, South, East, North]
  explicit: [-73.65, 42.45, -71.45, 45.45]
  padding: 0.02

layers:
  # Towns/cousubs for each state - emit water layers via subtract operation
  # This ensures water display matches cutouts exactly (no offset issues)

  - name: towns_vt
    source: census://cousub/VT
    patterns:
      - pattern: concentric
        spacing: 10
        angle: 0
      - pattern: zigzag
        spacing: 8
        angle: 45
      - pattern: honeycomb
        spacing: 12
        angle: 30
      - pattern: meander
        spacing: 10
        angle: 60
      - pattern: spiral
        spacing: 8
        angle: 0
      - pattern: truchet
        spacing: 12
        angle: 90
    operations:
      - type: subtract
        params:
          source: census://areawater/VT
          by_county: true
          min_size: 3
          emit_as: water_vt
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  - name: towns_ny
    source: census://cousub/NY
    patterns:
      - pattern: lines
        spacing: 8
        angle: 45
      - pattern: brick
        spacing: 10
        angle: 0
      - pattern: wiggle
        spacing: 12
        angle: 30
      - pattern: hilbert
        spacing: 8
        angle: 90
      - pattern: crosshatch
        spacing: 10
        angle: 45
      - pattern: gosper
        spacing: 12
        angle: 60
    operations:
      - type: subtract
        params:
          source: census://areawater/NY
          by_county: true
          min_size: 3
          emit_as: water_ny
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  - name: towns_nh
    source: census://cousub/NH
    patterns:
      - pattern: peano
        spacing: 10
        angle: 0
      - pattern: concentric
        spacing: 12
        angle: 0
      - pattern: stripe
        spacing: 8
        angle: 60
      - pattern: zigzag
        spacing: 10
        angle: 30
      - pattern: honeycomb
        spacing: 8
        angle: 45
      - pattern: spiral
        spacing: 12
        angle: 90
    operations:
      - type: subtract
        params:
          source: census://areawater/NH
          by_county: true
          min_size: 3
          emit_as: water_nh
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  - name: towns_ma
    source: census://cousub/MA
    patterns:
      - pattern: meander
        spacing: 12
        angle: 45
      - pattern: truchet
        spacing: 8
        angle: 0
      - pattern: hilbert
        spacing: 10
        angle: 90
      - pattern: lines
        spacing: 12
        angle: 30
      - pattern: wiggle
        spacing: 8
        angle: 60
      - pattern: brick
        spacing: 10
        angle: 45
    operations:
      - type: subtract
        params:
          source: census://areawater/MA
          by_county: true
          min_size: 3
          emit_as: water_ma
          emit_style:
            stroke: "#666666"
            stroke_width: "0.15"
            fill: "none"
          emit_order: 10
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  # County boundaries for each state (no patterns - just outlines)
  - name: counties_vt
    source: census://county/VT
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  - name: counties_ny
    source: census://county/NY
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  - name: counties_nh
    source: census://county/NH
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  - name: counties_ma
    source: census://county/MA
    operations:
      - type: clip
    style:
      stroke: "#444444"
      stroke_width: "0.15"
      fill: "none"
      order: "80"

  # Quebec municipalities (Canadian data)
  - name: quebec_muni
    source: quebec://municipalities
    patterns:
      - pattern: gosper
        spacing: 8
        angle: 30
      - pattern: stripe
        spacing: 10
        angle: 0
      - pattern: peano
        spacing: 12
        angle: 60
      - pattern: crosshatch
        spacing: 8
        angle: 45
      - pattern: concentric
        spacing: 10
        angle: 0
      - pattern: zigzag
        spacing: 12
        angle: 90
    operations:
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "50"

  # NHN water for Lake Champlain Quebec portion (all use concentric)
  - name: water_quebec_champlain
    source: canada://nhn/02OHB00
    patterns:
      - pattern: concentric
        spacing: 10
    operations:
      - type: filter_by_size
        params:
          min_size: 3
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "15"

  # NHN water for Richelieu River corridor
  - name: water_richelieu
    source: canada://nhn/02OJ000
    patterns:
      - pattern: concentric
        spacing: 10
    operations:
      - type: filter_by_size
        params:
          min_size: 3
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "15"

  # NHN water for Lake Memphremagog area
  - name: water_memphremagog
    source: canada://nhn/02OE000
    patterns:
      - pattern: concentric
        spacing: 10
    operations:
      - type: filter_by_size
        params:
          min_size: 3
      - type: clip
    style:
      stroke: "#666666"
      stroke_width: "0.15"
      fill: "none"
      order: "15"

  # State/Province boundaries (no patterns - just outlines)
  - name: state_vt
    source: census://state/VT
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"

  - name: state_ny
    source: census://state/NY
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"

  - name: state_nh
    source: census://state/NH
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"

  - name: state_ma
    source: census://state/MA
    operations:
      - type: clip
    style:
      stroke: "#333333"
      stroke_width: "0.8"
      fill: "none"
      order: "90"
